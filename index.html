<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Hetalia RPG in China Wiki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <div class="header-top">
        <h1>Home</h1>
        <button class="menu-btn" aria-label="常看" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
      </div>
        <section class="card">
            <h2>About</h2>
            <p>Click <a href="list.html">here</a> to get the whole list.</p>
            <p>The Chinese Hetalia fandom has its own 2p! and Nyo! character names. Click <a href="characters.html">here</a> to find it.</p>
        </section>
        <section class="card">
            <h2>Articles</h2>
            <div class="gallery-grid">
                <div class="gallery-item">
                    <a href="anthropic.html" ><img src="assets/images/Heta_Anthropic_Reincarnation_黑塔人类纪行.png" alt="Heta Anthropic Reincarnation Cover"><p>Heta Anthropic Reincarnation (黑塔人类纪行)</p></a>
                </div>
                <div class="gallery-item">
                    <a href="runaway.html"><img src="assets/images/Hetalia_Runaway_Express_Cover.png" alt="Hetalia Runaway Express Cover"><p>Heta Runaway Express (黑塔逃亡列车)</p></a>
                </div>
            </div>
        </section>
        <section class="card">
            <h2>Our Social Media</h2>
            <div class="gallery-grid">
                <div class="gallery-item">
                    <a href="https://discord.gg/DCav5efRtU" target="_blank"><img src="assets/images/Discord_Community.png" alt="Discord Logo"><p>Discord Community</p>
                    </a>
                </div>
            </div>
    </section>

    <!-- 侧边栏（常看）与遮罩 -->
    <aside>
        <h2>常看</h2>
        <dl>
            <dt>黑塔人类纪行</dt>
            <dd>
                <a href="anthropic.html" target="_blank">
                    <img src="assets/images/Heta_Anthropic_Reincarnation_黑塔人类纪行.png"
                         alt="Heta Anthropic Reincarnation 黑塔人类纪行"
                         width="100">
                </a>
            </dd>
        </dl>
    </aside>
    <div class="overlay"></div>

    <script>
        (function () {
            const menuBtn = document.querySelector('.menu-btn');
            const aside = document.querySelector('aside');
            const overlay = document.querySelector('.overlay');
            if (!menuBtn || !aside || !overlay) return;

            const setMenu = (open) => {
                aside.classList.toggle('open', open);
                overlay.classList.toggle('open', open);
                menuBtn.setAttribute('aria-expanded', String(open));
            };

            menuBtn.addEventListener('click', () => {
                setMenu(!aside.classList.contains('open'));
            });
            overlay.addEventListener('click', () => setMenu(false));
        })();
    </script>
</body>
</html>
