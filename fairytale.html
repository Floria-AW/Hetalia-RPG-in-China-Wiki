<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Fairytale - Hetalia RPG in China Wiki</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <header class="header-top">
        <h1>World Fairytale (黑塔童话世纪)</h1>
        <button class="menu-btn" aria-label="常看">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </header>

      <!-- 基本信息卡片 -->
      <section class="card">
        <p><strong>Creator:</strong> Alice (爱丽丝)</p>
        <p><em>World Fairytale (黑塔童话世纪)</em> is a Chinese language RPG created by Alice based on the Japanese comics <em>Hetalia: World★Stars</em>.</p>
      </section>

      <footer>
        <p><a href="list.html">&larr; Back to Game List</a></p>
      </footer>
    </div>

    <!-- 侧边栏（常看）与遮罩 -->
    <aside>
      <h2>常看</h2>
      <dl>
        <dt>黑塔人类纪行</dt>
        <dd><a href="anthropic.html" target="_blank"><img src="assets/images/Heta_Anthropic_Reincarnation_黑塔人类纪行.png" width="100"></a></dd>
      </dl>
    </aside>
    <div class="overlay"></div>

    <script>
    (function () {
    const menuBtn = document.querySelector('.menu-btn');
    const aside = document.querySelector('aside');
    const overlay = document.querySelector('.overlay');
    if (!menuBtn || !aside || !overlay) return;

    const setMenu = (open) => {
    aside.classList.toggle('open', open);
    overlay.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', open);
    };

    menuBtn.addEventListener('click', () => {
    setMenu(!aside.classList.contains('open'));
    });
    overlay.addEventListener('click', () => setMenu(false));
    })();
    </script>
  </body>
</html>
